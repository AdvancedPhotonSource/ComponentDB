{% set name = "ComponentDB-CLI" %}
{% set version = "3.18.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  path: ../../packages/cli

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation

requirements:
  host:
    - python>=3.10
    - hatchling
    - pip
  run:
    - python
    - python-dateutil >=2.8.2
    - urllib3 >=2.6.3,<3.0.0
    - click
    - pandas
    - rich
    - paho-mqtt
    - componentdb-api=={{ version }}


test:
  imports:
    - cdbCli

about:
  home: "https://github.com/AdvancedPhotonSource/ComponentDB"
  license: "Copyright (c) UChicago Argonne, LLC. All rights reserved."    
  summary: "Command line utilities for Component DB"
