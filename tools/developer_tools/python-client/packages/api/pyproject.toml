[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "componentdb-api"
version = "3.18.0"
description = "Python APIs used to communicate with java hosted ComponentDB API."
license = { text = "Copyright (c) UChicago Argonne, LLC. All rights reserved." }
maintainers = [
    { name = "Dariusz Jarosz", email = "djarosz@aps.anl.gov" },
]
requires-python = ">=3.10"
dependencies = [
    "urllib3 >= 2.6.3, < 3.0.0",
    "python-dateutil >= 2.8.2",
    "pydantic >= 2.11",
    "typing-extensions >= 4.7.1",
    "certifi",
]

[project.urls]
Homepage = "https://github.com/AdvancedPhotonSource/ComponentDB"

[project.scripts]
cdb-python-client-test = "CdbApiFactory:run_command"

# cdbApi/ is generated by ../../generatePyClient.sh and is gitignored, so it must be
# explicitly included here -- hatchling otherwise honors .gitignore when selecting files.
[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
only-include = ["cdbApi", "CdbApiFactory.py"]

[tool.hatch.build.targets.sdist]
only-include = ["cdbApi", "CdbApiFactory.py"]
