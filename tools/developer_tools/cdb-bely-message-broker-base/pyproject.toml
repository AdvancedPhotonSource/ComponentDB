[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdb-bely-message-broker-base"
version = "1.0.0"
description = "Shared pluggable MQTT message broker framework for ComponentDB and BELY"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ComponentDB / BELY Team"}
]
keywords = ["mqtt", "cdb", "componentdb", "bely", "plugins", "framework", "events", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Framework :: AsyncIO",
]

dependencies = [
    "click>=8.1.0",
    "paho-mqtt>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/AdvancedPhotonSource/ComponentDB"
Repository = "https://github.com/AdvancedPhotonSource/ComponentDB"
Documentation = "https://github.com/AdvancedPhotonSource/ComponentDB/tree/master/tools/developer_tools/cdb-bely-message-broker-base/docs"
Changelog = "https://github.com/AdvancedPhotonSource/ComponentDB/blob/master/tools/developer_tools/cdb-bely-message-broker-base/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black==26.1.0",
    "ruff==0.15.1",
    "mypy>=1.0.0",
    "types-paho-mqtt>=1.6.0",
    "types-PyYAML>=6.0.0",
]

[tool.setuptools.package-data]
cdb_bely_message_broker_base = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
