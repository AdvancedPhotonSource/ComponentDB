<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core">

    <p:outputPanel rendered='#{propertyValueController.getPropertyEditPage(propertyValueObject) 
                               == "pdmLinkPropertyValueEditPanel"}' 
                   styleClass="longCellInput inlineOutputPanel">
        <p:outputPanel id="propertyValueEditValuePanel#{propertyValueObject.viewUUID}"
                       styleClass="inlineOutputPanel">
            <p:panelGrid layout="tabular" columns="2"
                         styleClass="inlineOutputPanel">
                <h:outputText value="#{propertyValueObject.value}" /> 
                <p:commandButton icon="fa fa-search"
                                 onclick="showPDMLinkPropertyValueSearchDialog()">
                    <f:setPropertyActionListener target="#{entityController.currentEditPropertyValue}"
                                                 value="#{propertyValueObject}"/>
                </p:commandButton>
            </p:panelGrid>
        </p:outputPanel>
    </p:outputPanel>    

</ui:composition>
