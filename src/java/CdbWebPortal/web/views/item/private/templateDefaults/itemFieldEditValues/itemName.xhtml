<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui">
    <p:column id="name#{viewName}"
              rendered="#{entityController.entityDisplayItemName}">
        <p:inputText id="nameInputText#{viewName}" value="#{itemObject.name}"                  
                     title="#{entityController.nameTitle}" 
                     styleClass="entityDataEmphasizedText"
                     required="true"
                     requiredMessage="#{entityController.nameTitle} is required">
            <p:ajax event="keyup" process="@this" update="nameMessage#{viewName}"/>
        </p:inputText>
        <p:message id="nameMessage#{viewName}" for="nameInputText#{viewName}" />
    </p:column>


</ui:composition>
