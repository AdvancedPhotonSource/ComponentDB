<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

    <h:body>
        <ui:composition template="../templates/loginViewTemplate.xhtml">
            <ui:define name="bottom">
                <h:form id="loginForm">
                    <p:growl id="messages" showDetail="true">
                        <p:autoUpdate/>
                    </p:growl>
                    
                    <div class="login">
                        <div>
                            <p:inputText id="username" value="#{loginController.username}" title="Username" placeholder="Username"/>
                        </div>
                        <div>
                            <p:password id="password" value="#{loginController.password}" title="Password" placeholder="Password"/>
                        </div>
                        <p/>
                        <div>
                            <p:commandButton id="loginButton" value="Login" action="#{loginController.login()}" />
                        </div>
                    </div>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
