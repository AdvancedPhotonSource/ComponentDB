<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"                                
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core">   

    <ui:param name="optionId" value="connectedDevicesEndpoint#{endpointNum}Option"/>
    <ui:param name="optionName" value="End#{endpointNum} Connected Devices"/>            
    <ui:param name="optionDescription" value="List of connected devices for cable end #{endpointNum}."/>
    <ui:param name="displaySettingName" value="connectedDevicesEndpoint#{endpointNum}Display"/>

    <p:selectBooleanCheckbox id="#{optionId}"
                             value="#{entitySettingObject[displaySettingName]}"/>

    <h:outputLabel for="#{optionId}" 
                   value="#{optionName}" 
                   styleClass="dialogDataLabel"
                   title="#{optionDescription}"/>

</ui:composition>
