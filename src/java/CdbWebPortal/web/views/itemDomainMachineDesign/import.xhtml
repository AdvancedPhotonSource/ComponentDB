<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                template="../item/private/templates/itemCreateTemplate.xhtml">

    <f:metadata>
        <f:viewAction action="#{settingController.updateGlobalSettings()}" />
        <f:viewAction action="#{itemDomainMachineDesignController.processCreateRequestParams}"/>
        <f:viewAction action="#{logController.processPreRender()}"/>
    </f:metadata>

    <ui:param name="entityController" value="#{itemDomainMachineDesignController}"/>    

    <ui:define name="middleCenter">

        <h:form id="importMachineDesignForm" 
                enctype="multipart/form-data"
                rendered="#{loginController.loggedInForImport and pageRendered}">

            <div class="pageTitle">
                <h1>Import Machine Elements</h1>
            </div>

            <ui:include src="../item/private/importWizard/importWizard.xhtml">
                <ui:param name="entityController" value="#{entityController}" />
            </ui:include>

        </h:form>

    </ui:define>

</ui:composition>
