<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">

    <p:dataTable id="propertyValueSearchDataTable"
                 var="searchResultObject"
                 value="#{propertyValueController.searchResultList}"
                 sortMode="single"
                 stripedRows="true"
                 paginator="true"
                 paginatorAlwaysVisible="false"
                 rows="#{searchController.searchSettings.displayNumberOfItemsPerPage}"
                 emptyMessage="No property values match.">

        <p:column sortBy="#{searchResultObject.objectName}" headerText="Property Value">
            <p:commandLink value="#{searchResultObject.objectName}"
                           title="Go to parent item: #{searchResultObject.objectName}"
                           action="#{propertyValueController.redirectToParentItem(searchResultObject.cdbEntity)}"/>
        </p:column>

        <p:column sortBy="#{searchResultObject.display}" headerText="Match Description">
            <h:outputText value="#{searchResultObject.display}"/>
        </p:column>

        <p:column sortBy="#{searchResultObject.objectId}" headerText="Id">
            <h:outputText value="#{searchResultObject.objectId}"/>
        </p:column>

    </p:dataTable>

</ui:composition>
