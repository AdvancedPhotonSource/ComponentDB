<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:h="http://xmlns.jcp.org/jsf/html">

    <p:dialog id="propertyValueDetailsDialog"
              widgetVar="propertyValueDetailsDialogWidget"
              header="Property Details"
              width="50vw"
              modal="true"
              resizable="false">

        <ui:param name="propertyValueObject" value="#{propertyValueController.current}"/>

        <p:panelGrid styleClass="ui-noborder">
            <p:row>
                <p:column styleClass="ui-panelgrid-bold">Type</p:column>
                <p:column><h:outputText value="#{propertyValueObject.propertyType.name}"/></p:column>
            </p:row>
            <p:row>
                <p:column styleClass="ui-panelgrid-bold">Tag</p:column>
                <p:column><h:outputText value="#{propertyValueObject.tag}"/></p:column>
            </p:row>
            <p:row>
                <p:column styleClass="ui-panelgrid-bold">Value</p:column>
                <p:column>
                    <ui:include src="propertyValueListObjectValue.xhtml"/>
                </p:column>
            </p:row>
            <p:row>
                <p:column styleClass="ui-panelgrid-bold">Description</p:column>
                <p:column><h:outputText value="#{propertyValueObject.description}"/></p:column>
            </p:row>
            <p:row>
                <p:column styleClass="ui-panelgrid-bold">Category</p:column>
                <p:column><h:outputText value="#{propertyValueObject.propertyType.propertyTypeCategory.name}"/></p:column>
            </p:row>
            <p:row>
                <p:column styleClass="ui-panelgrid-bold">Units</p:column>
                <p:column><h:outputText value="#{propertyValueObject.units}"/></p:column>
            </p:row>
            <p:row>
                <p:column styleClass="ui-panelgrid-bold">Entered By</p:column>
                <p:column><h:outputText value="#{propertyValueObject.enteredByUser.username}"/></p:column>
            </p:row>
            <p:row>
                <p:column styleClass="ui-panelgrid-bold">Entered On</p:column>
                <p:column><h:outputText value="#{propertyValueObject.enteredOnDateTime}"/></p:column>
            </p:row>
            <p:row>
                <p:column styleClass="ui-panelgrid-bold">Effective Date</p:column>
                <p:column><h:outputText value="#{propertyValueObject.effectiveFromDateTime}"/></p:column>
            </p:row>
        </p:panelGrid>

        <f:facet name="footer">
            <p:commandButton value="Close"
                             icon="fa fa-close"
                             onclick="PF('propertyValueDetailsDialogWidget').hide()"/>
        </f:facet>

    </p:dialog>

</ui:composition>
