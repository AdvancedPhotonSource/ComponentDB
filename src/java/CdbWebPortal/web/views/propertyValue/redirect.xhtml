<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:f="http://java.sun.com/jsf/core">

    <!--
    Short property permalink. Resolves the item owning the property value
    supplied via the "id" request parameter and redirects to that item's view
    with the property value dialog opened on load.
    -->
    <f:metadata>
        <f:viewAction action="#{propertyValueController.redirectToItemForPropertyValueViewParam()}"/>
    </f:metadata>

</ui:composition>
