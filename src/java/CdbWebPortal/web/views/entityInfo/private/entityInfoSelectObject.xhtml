<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">
    
    <ui:param name="#{entitySettingObject}" value="#{entityController.settingObject}" />

    <p:column sortBy="#{entityInfoSelectObject.ownerUser.username}" headerText="Owner"
              filterBy="#{entityInfoSelectObject.ownerUser.username}" filterMatchMode="contains"
              filterValue="#{entitySettingObject.selectFilterByOwnerUser}"
              rendered="#{entitySettingObject.selectDisplayOwnerUser}">
        <h:outputText value="#{entityInfoSelectObject.ownerUser.username}"/>
    </p:column>

    <p:column sortBy="#{entityInfoSelectObject.ownerUserGroup.name}" headerText="Group"
              filterBy="#{entityInfoSelectObject.ownerUserGroup.name}" filterMatchMode="exact"
              filterValue="#{entitySettingObject.selectFilterByOwnerGroup}"
              rendered="#{entitySettingObject.selectDisplayOwnerGroup}">
        <f:facet name="filter">
            <p:selectOneMenu value="#{entitySettingObject.selectFilterByOwnerGroup}"
                             onchange="PrimeFaces.getWidgetById($(this).closest('.ui-datatable').attr('id')).filter()">
                <f:selectItems value="#{facesUtility.getFilterSelectItems(userGroupController.availableItemsForSelectOne)}" />
            </p:selectOneMenu>
        </f:facet>
        <h:outputText value="#{entityInfoSelectObject.ownerUserGroup.name}"/>
    </p:column>

    <p:column sortBy="#{entityInfoSelectObject.createdByUser.username}" headerText="Created By"
              filterBy="#{entityInfoSelectObject.createdByUser.username}" filterMatchMode="contains"
              filterValue="#{entitySettingObject.selectFilterByCreatedByUser}"
              rendered="#{entitySettingObject.selectDisplayCreatedByUser}">
        <h:outputText value="#{entityInfoSelectObject.createdByUser.username}"/>
    </p:column>

    <p:column sortBy="#{entityInfoSelectObject.createdOnDateTime}" headerText="Created On"
              filterBy="#{entityInfoSelectObject.createdOnDateTime}" filterMatchMode="contains"
              filterValue="#{entitySettingObject.selectFilterByCreatedOnDateTime}"
              rendered="#{entitySettingObject.selectDisplayCreatedOnDateTime}">
        <h:outputText value="#{entityInfoSelectObject.createdOnDateTime}"/>
    </p:column>

    <p:column sortBy="#{entityInfoSelectObject.lastModifiedByUser.username}" headerText="Modified By"
              filterBy="#{entityInfoSelectObject.lastModifiedByUser.username}" filterMatchMode="contains"
              filterValue="#{entitySettingObject.selectFilterByLastModifiedByUser}"
              rendered="#{entitySettingObject.selectDisplayLastModifiedByUser}">
        <h:outputText value="#{entityInfoSelectObject.lastModifiedByUser.username}"/>
    </p:column>

    <p:column sortBy="#{entityInfoSelectObject.lastModifiedOnDateTime}" headerText="Modified On"
              filterBy="#{entityInfoSelectObject.lastModifiedOnDateTime}" filterMatchMode="contains"
              filterValue="#{entitySettingObject.selectFilterByLastModifiedOnDateTime}"
              rendered="#{entitySettingObject.selectDisplayLastModifiedOnDateTime}">
        <h:outputText value="#{entityInfoSelectObject.lastModifiedOnDateTime}"/>
    </p:column>

</ui:composition>
