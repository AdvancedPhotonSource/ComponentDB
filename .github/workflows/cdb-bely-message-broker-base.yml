name: CDB/BELY MQTT Message Broker Base

on:
  push:
    paths:
      - "tools/developer_tools/cdb-bely-message-broker-base/**"
      - ".github/workflows/cdb-bely-message-broker-base.yml"
  pull_request:
    paths:
      - "tools/developer_tools/cdb-bely-message-broker-base/**"
      - ".github/workflows/cdb-bely-message-broker-base.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run message broker base tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tools/developer_tools/cdb-bely-message-broker-base

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make install-dev

      - name: Lint
        run: make lint

      - name: Type check
        run: make type-check

      - name: Run tests with coverage
        run: make test-cov
